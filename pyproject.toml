[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-ir"
version = "0.1.0"
description = "Falsifiable framework for domain-specific information retrieval"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root is the clinical_ir package and holds its __init__.py; stop pytest from
# collecting the root as a test package, which fails when the checkout folder name is
# not a valid Python identifier (e.g. "Clinical-Information-Retrieval").
addopts = "--confcutdir=tests"

[tool.setuptools]
package-dir = {"clinical_ir" = "."}
packages = ["clinical_ir"]
