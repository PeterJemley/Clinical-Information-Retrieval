[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-ir"
version = "0.1.0"
description = "Falsifiable framework for domain-specific information retrieval"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
