name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # check_stage1.py compares the framework files with the registered commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install, with versions pinned
        run: python -m pip install -c .github/constraints.txt -e ".[dev]"
      - name: Framework tests
        run: python -m pytest
      - name: Stage 1 checks (Amendment 2, B4)
        run: python evals/modulated-composition-2026-10-04/stage1/check_stage1.py
